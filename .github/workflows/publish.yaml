name: Publish design tokens

on:
  workflow_dispatch:
  push:
    tags:
      - "design-tokens-v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Check release tag
        working-directory: packages/design-tokens
        run: |
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo "Publishing requires a version tag."
            exit 1
          fi

          VERSION=$(node -p "require('./package.json').version")

          if [ "design-tokens-v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $VERSION."
            exit 1
          fi

      - name: Set up npm 11
        run: npm install --global npm@11

      - name: Install dependencies
        run: make install

      - name: Run checks and build
        run: make check

      - name: Publish package
        working-directory: packages/design-tokens
        run: npm publish --access public
